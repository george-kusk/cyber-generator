<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CYBERPUNK VECTOR GEN v6.0</title>
    <style>
        body {
            /* Затемняющий слой поверх плит, чтобы они ушли на красивый задний план */
            background-image: 
                linear-gradient(rgba(10, 10, 12, 0.93), rgba(10, 10, 12, 0.93)), 
                url('bg.png'); 
            
            background-repeat: repeat;
            background-attachment: fixed;
            background-size: 380px auto;
            
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #00ffcc;
            background-color: #0a0a0c;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Неоновый sci-fi заголовок */
        h1 {
            color: #00ffcc !important;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* Матовая панель управления (эффект матового стекла) */
        .control-panel {
            background: rgba(15, 15, 20, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Контрастный белый текст для подписей (ползунков) */
        .control-group label {
            color: #ffffff !important;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .shape-selector {
            display: flex;
            gap: 20px;
            margin-top: 4px;
        }

        .shape-selector label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff !important;
            cursor: pointer;
        }

        /* Индустриальная кнопка EXPORT */
        #download-btn {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #download-btn:hover {
            background: #00ffcc;
            color: #0a0a0f;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.7);
        }

        /* Окно холста генератора */
        #canvas {
            display: inline-block;
            background: #050508;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 35px rgba(0,0,0,0.7);
            line-height: 0;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>SYSTEM.GEOMETRY.GEN //</h1>

    <div class="control-panel">
        <div class="control-group">
            <label>ГЕОМЕТРИЯ</label>
            <div class="shape-selector">
                <label><input type="radio" name="shape" value="circle" checked><span class="shape-option">Круг</span></label>
                <label><input type="radio" name="shape" value="square"><span class="shape-option">Квадрат</span></label>
            </div>
        </div>
        <div class="control-group">
            <label>Количество линий</label>
            <input type="range" id="lines" min="5" max="40" value="15">
        </div>
        <div class="control-group">
            <label>Расстояние (шаг)</label>
            <input type="range" id="step" min="2" max="20" value="6">
        </div>
        <div class="control-group">
            <label>Толщина контура</label>
            <input type="range" id="width" min="1" max="10" value="1">
        </div>
        <button id="download-btn">💾 EXPORT SVG</button>
    </div>

    <div id="canvas"></div>

    <script>
        let svgStr = "";
        function draw() {
            const size = 500, c = size / 2;
            const lines = document.getElementById('lines').value;
            const step = document.getElementById('step').value;
            const thick = document.getElementById('width').value;
            const shape = document.querySelector('input[name="shape"]:checked').value;
            
            let color = `hsl(${Math.floor(Math.random() * 360)}, 100%, 50%)`;
            svgStr = `<svg width="${size}" height="${size}" xmlns="http://w3.org">`;

            for (let i = 1; i <= lines; i++) {
                let r = i * step;
                if (shape === "circle") {
                    svgStr += `<circle cx="${c}" cy="${c}" r="${r}" stroke="${color}" stroke-width="${thick}" fill="none"/>`;
                } else {
                    svgStr += `<rect x="${c-r}" y="${c-r}" width="${r*2}" height="${r*2}" stroke="${color}" stroke-width="${thick}" fill="none"/>`;
                }
            }
            svgStr += `</svg>`;
            document.getElementById('canvas').innerHTML = svgStr;
        }

        document.querySelectorAll('input').forEach(el => el.addEventListener('input', draw));
        document.querySelectorAll('input[name="shape"]').forEach(el => el.addEventListener('change', draw));
        
        document.getElementById('download-btn').addEventListener('click', function() {
            const blob = new Blob([svgStr], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "vector.svg";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });

        draw();
    </script>
</body>
</html>
